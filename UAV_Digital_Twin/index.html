<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Digital Twin - GLB Viewer</title>
    
    <!-- External Dependencies: PyScript, Three.js, OrbitControls, GLTFLoader, GSAP -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #080c14; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #info-panel {
            position: absolute; top: 15px; left: 15px; right: 15px; color: #00f0ff;
            background: rgba(10, 15, 30, 0.85); padding: 12px 18px;
            border-radius: 8px; border: 1px solid #00f0ff; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h3 style="margin: 0 0 5px 0;">UAV Digital Twin Interface</h3>
        <p style="margin: 0; font-size: 13px; color: #aaa;">Click or tap any component to enlarge and activate Wireframe mode.</p>
        <p id="status-text" style="color: #fff; font-size: 12px; margin-top: 6px; font-weight: bold;">Loading 3D Model...</p>
    </div>

    <div id="canvas-container"></div>

    <script type="py">
import js
from pyodide.ffi import create_proxy

container = js.document.getElementById("canvas-container")

# 1. Initialize Scene, Camera, and WebGL Renderer
scene = js.THREE.Scene.new()
camera = js.THREE.PerspectiveCamera.new(60, js.window.innerWidth / js.window.innerHeight, 0.1, 1000)
camera.position.set(0, 3, 8)

renderer = js.THREE.WebGLRenderer.new({"antialias": True})
renderer.setSize(js.window.innerWidth, js.window.innerHeight)
renderer.setPixelRatio(js.window.devicePixelRatio)
container.appendChild(renderer.domElement)

# 2. Add Orbit Controls
controls = js.THREE.OrbitControls.new(camera, renderer.domElement)
controls.enableDamping = True

# 3. Add Lighting
ambient_light = js.THREE.AmbientLight.new(0xffffff, 0.8)
scene.add(ambient_light)
dir_light = js.THREE.DirectionalLight.new(0x00f0ff, 1.5)
dir_light.position.set(5, 10, 7)
scene.add(dir_light)

# State Variables
uav_model = None
clickable_parts = []
original_scales = {}
selected_object = None

raycaster = js.THREE.Raycaster.new()
mouse = js.THREE.Vector2.new()

# 4. Load GLB File
loader = js.THREE.GLTFLoader.new()

def on_load_success(gltf):
    global uav_model
    uav_model = gltf.scene
    scene.add(uav_model)
    
    def traverse_child(child, *args):
        if child.isMesh:
            clickable_parts.append(child)
            original_scales[child.uuid] = {
                "x": child.scale.x,
                "y": child.scale.y,
                "z": child.scale.z
            }
            child.material = child.material.clone()

    uav_model.traverse(create_proxy(traverse_child))
    
    # Auto-center model in viewport
    box = js.THREE.Box3.new().setFromObject(uav_model)
    center = box.getCenter(js.THREE.Vector3.new())
    uav_model.position.sub(center)
    
    js.document.getElementById("status-text").innerText = "State: Overview (Model Loaded)"

def on_load_error(error):
    js.document.getElementById("status-text").innerText = "Error: Check if uav_model.glb exists in folder"

loader.load("uav_model.glb", create_proxy(on_load_success), None, create_proxy(on_load_error))

# 5. Raycasting Logic for Selections
def handle_pointer(x, y):
    global selected_object
    if not uav_model or len(clickable_parts) == 0:
        return

    rect = renderer.domElement.getBoundingClientRect()
    mouse.x = ((x - rect.left) / rect.width) * 2 - 1
    mouse.y = -((y - rect.top) / rect.height) * 2 + 1
    
    raycaster.setFromCamera(mouse, camera)
    intersects = raycaster.intersectObjects(clickable_parts)
    status_el = js.document.getElementById("status-text")

    if intersects.length > 0:
        hit_obj = intersects[0].object
        
        if selected_object and selected_object != hit_obj:
            reset_object(selected_object)

        if selected_object == hit_obj:
            reset_object(hit_obj)
            selected_object = None
            status_el.innerText = "State: Overview"
        else:
            selected_object = hit_obj
            part_name = hit_obj.name if hit_obj.name else "UAV Sub-mesh"
            status_el.innerText = f"Selected: {part_name}"
            
            # Activate wireframe
            hit_obj.material.wireframe = True
            
            # Smooth scale expansion via GSAP
            orig = original_scales[hit_obj.uuid]
            js.gsap.to(hit_obj.scale, {
                "x": orig["x"] * 1.3,
                "y": orig["y"] * 1.3,
                "z": orig["z"] * 1.3,
                "duration": 0.4
            })

def reset_object(obj):
    obj.material.wireframe = False
    orig = original_scales[obj.uuid]
    js.gsap.to(obj.scale, {
        "x": orig["x"],
        "y": orig["y"],
        "z": orig["z"],
        "duration": 0.4
    })

def on_click(event):
    handle_pointer(event.clientX, event.clientY)

js.window.addEventListener("click", create_proxy(on_click))

# 6. Render Loop
def animate(*args):
    js.requestAnimationFrame(create_proxy(animate))
    controls.update()
    renderer.render(scene, camera)

animate()
    </script>
</body>
</html>
